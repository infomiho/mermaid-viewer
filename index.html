<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edit, preview, share, and export Mermaid diagrams directly in your browser."
    />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://mermaid.static.miho.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mermaid Viewer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://mermaid.static.miho.dev/" />
    <meta property="og:title" content="Mermaid Viewer | Edit and preview diagrams" />
    <meta
      property="og:description"
      content="Edit, preview, share, and export Mermaid diagrams directly in your browser."
    />
    <meta property="og:image" content="https://mermaid.static.miho.dev/social-card-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mermaid code beside its rendered flowchart in the Mermaid Viewer interface."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mermaid Viewer | Edit and preview diagrams" />
    <meta
      name="twitter:description"
      content="Edit, preview, share, and export Mermaid diagrams directly in your browser."
    />
    <meta name="twitter:image" content="https://mermaid.static.miho.dev/social-card-v1.png" />
    <meta
      name="twitter:image:alt"
      content="Mermaid code beside its rendered flowchart in the Mermaid Viewer interface."
    />
    <title>Mermaid Viewer | Edit and preview diagrams</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Static tool</p>
          <h1 id="page-title">Mermaid Viewer</h1>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Ready</div>
      </header>

      <section class="workspace" aria-label="Mermaid editor and preview">
        <section class="panel editor-panel" aria-labelledby="editor-title">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Input</p>
              <h2 id="editor-title">Mermaid code</h2>
            </div>
          </div>
          <div class="editor-wrap" id="editor"></div>
        </section>

        <section class="panel preview-panel" id="preview-panel" aria-labelledby="preview-title">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Output</p>
              <h2 id="preview-title">Preview</h2>
            </div>
            <div class="button-row preview-tools" aria-label="Preview controls">
              <button class="ghost-button compact-button" id="zoom-out" type="button" aria-label="Zoom out">-</button>
              <button class="ghost-button compact-button zoom-readout" id="zoom-reset" type="button">100%</button>
              <button class="ghost-button compact-button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button class="ghost-button" id="fullscreen-button" type="button">Fullscreen</button>
              <button class="ghost-button" id="download-button" type="button">Download SVG</button>
            </div>
          </div>
          <div class="preview-frame" id="preview-frame" aria-label="Rendered Mermaid preview">
            <div class="preview-canvas" id="preview-canvas">
              <div class="diagram-target" id="preview"></div>
            </div>
          </div>
          <pre class="error-box" id="error" hidden></pre>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
